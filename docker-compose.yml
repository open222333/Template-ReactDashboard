services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_APP_NAME: "${VITE_APP_NAME:-Dashboard}"
        # 沒有後端時設 true，以 mock API 展示
        VITE_API_MOCK: "${VITE_API_MOCK:-false}"
    image: react-dashboard:latest
    restart: unless-stopped
    environment:
      # 後端位址：同一個 compose 用 service 名稱；主機上的服務用 http://host.docker.internal:8000
      API_UPSTREAM: "${API_UPSTREAM:-http://host.docker.internal:8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
